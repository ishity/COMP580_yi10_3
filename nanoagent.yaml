_ > nanoagent.plugin.v0001.ManifestConfig:
id: concept-gap-detection
name: Concept Gap Detection
version: 0.1.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  describe_corpus:
    description: Count a bundled corpus's papers and concepts, its frequent concepts and their postings P, its related pairs and what checking them all would cost, and the MinHash rows and rate signatures use
  build_signatures:
    description: Build MinHash signatures of the frequent concepts within the cost budget, save every related pair ranked by estimated Jaccard, lowest first, and return the cost charged and a histogram of the ranking
  check_pairs:
    description: Measure a rank range of the related pairs exactly, within the cost budget, and return the gaps among them with their exact intersection and union sizes
  exact_gaps:
    description: Measure every related pair of a corpus exactly and list the gaps, the task's reference

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  find-concept-gaps:
    description: Find every research gap, a pair of frequent and semantically similar concepts whose papers rarely overlap, within one cost budget for MinHash signatures and exact checks
    runner: agent
    tools: [describe_corpus, build_signatures, check_pairs]
    reference: exact_gaps
    instructions: |-
      Find every research gap in the dataset: a pair of concepts that are each well studied and close in meaning, but rarely studied together. A concept is frequent when at least min_papers papers mention it. Two concepts are similar when the cosine of their embeddings is at least threshold. Two distinct frequent concepts are related when they are similar and neither name is nested in the other (as translation is in machine translation). A related pair is a gap when the Jaccard similarity of its paper sets, |A ∩ B| / |A ∪ B|, is at most max_jaccard. All of this is decided exactly, with integers and fractions.
      Start with describe_corpus, passing dataset, min_papers and threshold as given. It returns how many papers and concepts there are, F (how many concepts are frequent), P (the frequent concepts' postings: their (concept, paper) entries in all), how many pairs are related, what checking every related pair exactly would cost, how many MinHash rows there are, and r, the cost of one signature entry. It charges nothing.
      One cost_budget pays for everything, and signatures and checks share it. Checking one pair exactly with check_pairs costs |A| + |B|, the papers of both concepts, since its two sorted paper lists are merged. Checking every related pair usually costs far more than the budget, so you need to decide which pairs to check.
      build_signatures gives every frequent concept a MinHash signature of rows rows: for each row, a fixed hash of each of the concept's papers, and the least of them. For two concepts, one row matches with probability exactly their Jaccard similarity, so the share of matching rows estimates it, with a standard deviation of about sqrt(J (1 - J) / rows). Pairs that never appear in the same paper have Jaccard 0, and their rows never match. More rows make the estimate sharper and separate small Jaccard values better, but cost more: signatures of rows rows cost rows times P times r, rounded up. A longer signature reuses the rows already built, so it costs only the extra rows: building more rows later charges only the difference, and building as many rows as before, or fewer, charges nothing. A build that would exceed the remaining budget is refused, and the error says the most rows that fit.
      build_signatures ranks every related pair by its number of matching rows, fewest first, because those are most likely to be gaps, and saves the ranking in the workspace. It returns the signature_id, the cost charged, used and remaining, how many related pairs there are, and a histogram: buckets of pairs in rank order, each with its fewest and most matching rows, the matching share as estimated Jaccard (truncated to 4 places), how many pairs it holds, what checking all of them would cost (check_cost), and its rank range, first_rank to last_rank. The ranking may hold more pairs than the budget can check: with too few rows, many pairs tie at the top and the true gaps are mixed with pairs that only look rare; with too many rows, little budget is left to check them.
      Check pairs with check_pairs: pass the signature_id, a rank range (start_rank, from 1, and count), and the task's dataset, min_papers, threshold, max_jaccard and cost_budget exactly as given (pass them to build_signatures exactly as given, too). It measures only pairs no earlier call checked, charges their |A| + |B|, and returns the gaps among them with their exact intersection and union sizes, how many pairs it checked and skipped, and the cost charged, used and remaining. A pair checked before is skipped at no cost, even under another signature_id. A range whose new pairs cost more than remains is refused, and the error says the largest count that fits.
      Submit every gap any check_pairs call returned, each once, with a and b exactly as returned. Submit no other pair: a pair that is not a gap makes the answer wrong, and the answer passes only when it holds at least min_recall of all gaps. If no check_pairs call returned a gap, submit an empty list: that is the correct answer when no related pair is a gap.
